run:
  version: "1.63"
  build-tags:
    - bench
    - ""
  tests: true

linters:
  disable-all: true
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errorlint
    - exhaustive
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goheader
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - makezero
    - misspell
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - tagliatelle
    - thelper
    - unconvert
    - unparam
    - unused
    - whitespace
    # Форматировщики из старой секции formatters теперь включаются здесь:
    - gci
    - gofmt
    - gofumpt

linters-settings:
  depguard:
    rules:
      Main:
        files:
          - $all
          - '!$test'
        allow:
          - $gostd
      Test:
        files:
          - $test
        allow:
          - $gostd
          - github.com/stretchr/testify
  funlen:
    lines: 150
    statements: 80

issues:
  # Настройки пресетов исключений
  exclude-use-default: false
  exclude-presets:
    - comments
    - common-false-positives
    - legacy
    - std-error-handling

  # Исключения по путям (комбинация старых exclusions и formatters.exclusions)
  exclude-dirs:
    - third_party$
    - builtin$
    - examples$

  # Правила исключений для конкретных файлов (замена старого rules)
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - errcheck
        - gocyclo
        - gosec
