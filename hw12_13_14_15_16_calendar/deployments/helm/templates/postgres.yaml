apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: "calendar_user"
            - name: POSTGRES_PASSWORD
              value: "calendar_password"
            - name: POSTGRES_DB
              value: "calendar"
          ports:
            - containerPort: 5432
              name: dbport
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
    - port: 5432
      targetPort: dbport
  selector:
    app: postgres