apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  labels:
    app: {{ .Values.api.name }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.api.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.api.name }}
    spec:
      containers:
        - name: {{ .Values.api.name }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8888
          volumeMounts:
            - name: config-volume
              mountPath: /etc/calendar
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: calendar-config
            items:
              - key: config_api.yaml
                path: config.yaml
